<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Bienvenidos al Gestor de Tareas</h1>
    <p>Esta aplicación te ayudará a organizar tus tareas diarias de manera eficiente.</p>
    <button onclick="window.location.href='/tasks'">Ver Tareas</button>

    <h2>Agregar Tarea</h2>
    <form action="/tasks" method="POST">
        <label for="title">Título:</label>
        <input type="text" id="title" name="title" required>
        <br>
        <label for="description">Descripción:</label>
        <textarea id="description" name="description" required></textarea>
        <br>
        <button type="submit">Agregar Tarea</button>
    </form>

    <h2>Buscar Tarea</h2>
    <form action="/tasks/search" method="GET">
        <label for="query">Buscar por Título:</label>
        <input type="text" id="query" name="query" required>
        <br>
        <button type="submit">Buscar</button>
    </form>

    <h2>Listar Tareas</h2>
    <form action="/tasks" method="GET">
        <button type="submit">Listar Todas las Tareas</button>
    </form>

    
    <h2>Actualizar Tarea</h2>
    <form action="/tasks/update" method="POST">
        <label for="taskId">ID de la Tarea:</label>
        <input type="text" id="taskId" name="taskId" required>
        <br>
        <label for="title">Nuevo Título:</label>
        <input type="text" id="title" name="title" required>
        <br>
        <label for="description">Nueva Descripción:</label>
        <textarea id="description" name="description" required></textarea>
        <br>
        <button type="submit">Actualizar Tarea</button>
    </form>
    
    <h2>Eliminar Tarea</h2>
    <form action="/tasks/delete" method="POST">
        <label for="taskId">ID de la Tarea:</label>
        <input type="text" id="taskId" name="taskId" required>
        <br>
        <button type="submit">Eliminar Tarea</button>
    </form>
</body>
</html>
